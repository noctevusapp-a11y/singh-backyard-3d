<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1410">
<title>Singh Residence - Backyard 3D</title>
<style>
  :root{
    --bg1:#f3d9bd; --bg2:#b9a6c9; --bg3:#4c5d8c;
    --ink:#fdf6ec; --ink2:#e5d6c3; --panel:rgba(27,20,16,.62); --panel-line:rgba(255,236,210,.18); --accent:#f0a860;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#1b1410;color:var(--ink);
    font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  model-viewer{position:fixed;inset:0;width:100%;height:100%;
    background:linear-gradient(180deg,var(--bg3) 0%,var(--bg2) 42%,var(--bg1) 78%,#e8c9a4 100%);
    --poster-color:transparent;--progress-bar-color:transparent}
  .top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 14px 0;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none}
  .title{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:9px 13px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:auto}
  .title b{display:block;font-size:15px;letter-spacing:.2px}
  .title span{font-size:12px;color:var(--ink2)}
  .btn{pointer-events:auto;appearance:none;border:1px solid var(--panel-line);background:var(--panel);color:var(--ink);border-radius:999px;padding:10px 15px;font:600 13px/1 inherit;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;white-space:nowrap}
  .btn:active{transform:scale(.97)}
  .btn.accent{background:var(--accent);color:#2b1a0c;border-color:transparent}
  .bar{position:fixed;left:0;right:0;bottom:0;padding:10px 0 calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(0deg,rgba(20,14,10,.78),rgba(20,14,10,0))}
  .hint{text-align:center;font-size:12px;color:var(--ink2);margin:0 14px 8px;text-shadow:0 1px 2px rgba(0,0,0,.45)}
  .row{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .row::-webkit-scrollbar{display:none}
  .row .grp{flex:0 0 auto;align-self:center;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink2);margin:0 2px 0 6px;opacity:.85}
  .chip{flex:0 0 auto;appearance:none;border:1px solid var(--panel-line);background:var(--panel);color:var(--ink);border-radius:999px;padding:10px 14px;font:600 13px/1 inherit;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--accent);color:#2b1a0c;border-color:transparent}
  .load{position:fixed;inset:0;display:grid;place-items:center;background:#1b1410;transition:opacity .5s;z-index:5}
  .load.done{opacity:0;pointer-events:none}
  .load div{width:min(70vw,320px);text-align:center}
  .load p{margin:0 0 12px;color:var(--ink2)}
  .meter{height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .note{position:fixed;left:14px;right:14px;top:calc(env(safe-area-inset-top) + 122px);font-size:12px;color:var(--ink2);text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
  .note.show{opacity:1}
  @media (min-width:760px){.bar{padding-bottom:18px}.hint{margin-bottom:10px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<model-viewer id="mv" src="singh_backyard.glb" ios-src="singh_backyard.usdz" alt="3D model of the Singh residence backyard"
  camera-controls touch-action="pan-y" interaction-prompt="none"
  ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor"
  shadow-intensity="1.1" shadow-softness="0.8" exposure="1.05" tone-mapping="commerce" environment-image="neutral"
  min-camera-orbit="auto 5deg 0.4m" max-camera-orbit="auto 178deg 120m" min-field-of-view="25deg" max-field-of-view="105deg"
  camera-orbit="-35deg 62deg 58m" camera-target="7.5m 0.5m -0.5m" field-of-view="40deg" interpolation-decay="80">
  <button slot="ar-button" class="btn accent" style="position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 74px);padding:9px 13px">View in your space (AR)</button>
</model-viewer>

<div class="top">
  <div class="title"><b>Singh Residence - Backyard</b><span>Concept 3D model, no pool</span></div>
</div>
<div class="note" id="note"></div>

<div class="bar">
  <p class="hint">Drag to look around. Pinch to zoom. Two fingers to move.</p>
  <div class="row" id="row"></div>
</div>

<div class="load" id="load"><div><p>Loading the backyard...</p><div class="meter"><i id="meter"></i></div></div></div>

<script type="module" src="model-viewer.min.js"></script>
<script>
(function(){
  var VIEWS = [{"name": "Overview", "orbit": "122.2deg 62.0deg 28.55m", "target": "6.71m 0.61m 0.61m", "fov": "38deg", "group": "Explore"}, {"name": "Lounge", "orbit": "-60.6deg 83.8deg 5.63m", "target": "7.32m 0.85m -0.30m", "fov": "70deg", "group": "Explore"}, {"name": "Bar and dining", "orbit": "41.2deg 83.1deg 5.83m", "target": "0.15m 0.91m -1.07m", "fov": "72deg", "group": "Explore"}, {"name": "Water wall", "orbit": "0.0deg 82.4deg 5.07m", "target": "7.32m 0.91m -2.29m", "fov": "62deg", "group": "Explore"}, {"name": "Sand box", "orbit": "-23.6deg 80.4deg 4.01m", "target": "12.50m 0.91m -0.15m", "fov": "70deg", "group": "Explore"}, {"name": "From the north", "orbit": "-129.7deg 59.8deg 18.78m", "target": "8.23m 0.91m 0.00m", "fov": "55deg", "group": "Explore"}, {"name": "Photo 1", "orbit": "84.9deg 83.3deg 6.71m", "target": "5.47m 1.44m -2.86m", "fov": "100.0deg", "group": "Your photo angles"}, {"name": "Photo 2", "orbit": "3.1deg 90.1deg 6.71m", "target": "7.03m 2.26m 3.52m", "fov": "85.0deg", "group": "Your photo angles"}, {"name": "Photo 3", "orbit": "-57.4deg 77.6deg 6.71m", "target": "4.40m 0.11m -2.11m", "fov": "87.0deg", "group": "Your photo angles"}, {"name": "Photo 4", "orbit": "33.9deg 89.2deg 6.71m", "target": "8.96m 1.74m -0.78m", "fov": "92.0deg", "group": "Your photo angles"}, {"name": "Photo 5", "orbit": "-143.2deg 81.0deg 6.71m", "target": "2.88m 0.38m 0.11m", "fov": "87.0deg", "group": "Your photo angles"}];
  var mv = document.getElementById('mv'), row = document.getElementById('row'), note = document.getElementById('note');
  var last = null, groups = {};
  VIEWS.forEach(function(v,i){
    if(!groups[v.group]){ groups[v.group]=1; var g=document.createElement('span'); g.className='grp'; g.textContent=v.group; row.appendChild(g); }
    var b=document.createElement('button'); b.className='chip'; b.textContent=v.name; b.setAttribute('aria-pressed','false');
    b.addEventListener('click',function(){ go(i,b); });
    row.appendChild(b);
  });
  function go(i,b){
    var v=VIEWS[i];
    mv.cameraTarget=v.target; mv.cameraOrbit=v.orbit; mv.fieldOfView=v.fov;
    if(last) last.setAttribute('aria-pressed','false'); b.setAttribute('aria-pressed','true'); last=b;
    b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
    if(v.group==='Your photo angles'){ note.textContent='Same camera position as your photo '+v.name.split(' ')[1]+', with the pool removed.'; note.classList.add('show'); setTimeout(function(){note.classList.remove('show')},3800); }
  }
  var chips=row.querySelectorAll('.chip'); mv.setAttribute('camera-orbit',VIEWS[0].orbit); mv.setAttribute('camera-target',VIEWS[0].target); mv.setAttribute('field-of-view',VIEWS[0].fov); chips[0].setAttribute('aria-pressed','true'); last=chips[0];
  var load=document.getElementById('load'), meter=document.getElementById('meter');
  mv.addEventListener('progress',function(e){ meter.style.width=Math.round(e.detail.totalProgress*100)+'%'; });
  mv.addEventListener('load',function(){ load.classList.add('done'); });
  mv.addEventListener('error',function(){ load.querySelector('p').textContent='Could not load the model. Please reopen this page with an internet connection or use the Images folder.'; });
  setTimeout(function(){ load.classList.add('done'); },15000);
})();
</script>
</body>
</html>
