<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15110e">
<title>Singh Backyard 3D</title>
<style>
  /* Layout: one full-screen stage (photo or live 3D), title card top-left, mode switch top-right, thumbnail dock along the bottom. */
  :root{
    --bg:#15110e; --panel:rgba(24,18,14,.7); --panel-line:rgba(255,232,205,.2);
    --ink:#fbf3e8; --ink-2:#e0cfba; --accent:#f0a860; --accent-ink:#2a190b; --ring:#ffd9a8;
    --stage-top:#20243d; --stage-mid:#6a5878; --stage-low:#d79a74; --stage-floor:#e9c39c;
    --font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--font-ui);overflow:hidden}
  .app{position:fixed;inset:0;overflow:hidden}
  .glass{background:var(--panel);border:1px solid var(--panel-line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  /* photo stage */
  #photo{position:absolute;inset:0;background:#0d0a08;touch-action:pan-y}
  #photo .bg,#photo .fg{position:absolute;inset:0;width:100%;height:100%}
  #photo .bg{object-fit:cover;filter:blur(28px) brightness(.55) saturate(1.1);transform:scale(1.15)}
  #photo .fg{object-fit:contain;transition:opacity .35s}
  #photo .fg.swap{opacity:0}
  /* 3D stage */
  #stage{position:absolute;inset:0;background:linear-gradient(180deg,var(--stage-top) 0%,var(--stage-mid) 45%,var(--stage-low) 80%,var(--stage-floor) 100%)}
  #stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
  .hidden{display:none!important}
  .title{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));max-width:calc(100% - 190px);padding:9px 14px 10px;border-radius:14px}
  .title h1{margin:0;font:400 22px/1.05 var(--font-display);text-wrap:balance}
  .title p{margin:3px 0 0;font-size:12px;color:var(--ink-2)}
  .seg{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px));display:flex;padding:3px;border-radius:999px}
  .seg button{appearance:none;border:0;background:transparent;color:var(--ink);font:600 13px/1 var(--font-ui);padding:9px 13px;border-radius:999px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .pill{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 128px);appearance:none;border:1px solid var(--panel-line);color:var(--ink);font:600 13px/1 var(--font-ui);padding:11px 15px;border-radius:999px;cursor:pointer}
  .pill.alt{right:auto;left:max(16px,env(safe-area-inset-left,0px))}
  .cap{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 176px);display:flex;justify-content:center;pointer-events:none}
  .cap p{margin:0;padding:8px 14px;border-radius:12px;font-size:13px;max-width:36em;text-align:center}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:1px solid var(--panel-line);color:var(--ink);font:400 20px/1 var(--font-ui);cursor:pointer;display:none}
  .arrow.l{left:12px}.arrow.r{right:12px}
  @media (hover:hover) and (min-width:760px){.arrow{display:block}}
  .dock{position:absolute;left:0;right:0;bottom:0;padding:34px 0 calc(env(safe-area-inset-bottom,0px) + 10px);background:linear-gradient(0deg,rgba(10,7,5,.82),rgba(10,7,5,0))}
  .row{display:flex;gap:8px;overflow-x:auto;padding:2px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .row::-webkit-scrollbar{display:none}
  .grp{flex:0 0 auto;align-self:center;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);margin:0 2px 0 8px;text-shadow:0 1px 2px rgba(0,0,0,.5);writing-mode:horizontal-tb}
  .chip{flex:0 0 auto;appearance:none;border:2px solid transparent;border-radius:12px;padding:0;overflow:hidden;cursor:pointer;background:#000;width:86px;color:var(--ink);text-align:left}
  .chip img{display:block;width:100%;height:58px;object-fit:cover}
  .chip span{display:block;padding:4px 6px 5px;font:600 11px/1.15 var(--font-ui);background:rgba(24,18,14,.88);min-height:30px}
  .chip[aria-pressed="true"]{border-color:var(--accent)}
  .chip.three{background:var(--panel)}
  .chip.three .ph{height:58px;display:grid;place-items:center;font:600 20px/1 var(--font-ui);color:var(--accent);background:linear-gradient(180deg,#3a3050,#8a6a62)}
  .chip:focus-visible,.pill:focus-visible,.seg button:focus-visible,.arrow:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
  .load{position:absolute;inset:0;display:grid;place-items:center;background:rgba(21,17,14,.92);z-index:5;transition:opacity .4s}
  .load.done{opacity:0;pointer-events:none}
  .load div{width:min(70vw,320px);text-align:center}
  .load p{margin:0 0 12px;color:var(--ink-2)}
  .meter{height:4px;border-radius:4px;background:var(--panel-line);overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .badge{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 100px);width:fit-content;max-width:calc(100% - 32px);padding:6px 12px;border-radius:12px;font-size:12px;color:var(--ink-2);pointer-events:none}
  @media (max-width:420px){.title h1{font-size:19px}.title{max-width:calc(100% - 178px)}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div id="photo"><img class="bg" id="pbg" alt=""><img class="fg" id="pfg" alt=""></div>
  <div id="stage" class="hidden" role="img" aria-label="Live 3D model of the Singh residence backyard"></div>

  <div class="title glass"><h1>Singh Residence</h1><p>Backyard concept, pool removed</p></div>
  <div class="seg glass" role="group" aria-label="View mode"><button id="mPhoto" aria-pressed="true">Photos</button><button id="m3d" aria-pressed="false">3D model</button></div>
  <div class="badge glass hidden" id="badge">Live 3D model, simplified. Switch to Photos for the realistic view.</div>

  <button class="arrow l glass" id="prev" aria-label="Previous view">&#8249;</button>
  <button class="arrow r glass" id="next" aria-label="Next view">&#8250;</button>
  <button class="pill glass" id="toggleBA">Show original photo</button>
  <button class="pill alt glass hidden" id="to3d">Look around in 3D</button>

  <div class="cap"><p class="glass" id="cap"></p></div>
  <div class="dock"><div class="row" id="row"></div></div>
  <div class="load" id="load"><div><p id="loadTxt">Loading photos...</p><div class="meter"><i id="meter"></i></div></div></div>
</div>

<script>
(function(){
  var ITEMS = JSON.parse(document.getElementById('viewsData').textContent);
  var GLB_URL = "singh_backyard.glb";
  var $ = function(id){ return document.getElementById(id); };
  var photo=$('photo'), pfg=$('pfg'), pbg=$('pbg'), stageEl=$('stage'), row=$('row'), cap=$('cap'), load=$('load'), meter=$('meter'), loadTxt=$('loadTxt');
  var mode='photo', idx=0, showOrig=false, chips=[], capTimer=null;

  /* ---------------- UI: dock ---------------- */
  var lastGroup=null;
  ITEMS.forEach(function(it,i){
    if(it.group!==lastGroup){ var g=document.createElement('span'); g.className='grp'; g.textContent=it.group; row.appendChild(g); lastGroup=it.group; }
    var b=document.createElement('button'); b.className='chip'+(it.img?'':' three'); b.setAttribute('aria-pressed','false'); b.setAttribute('aria-label',it.name);
    if(it.thumb){ var im=document.createElement('img'); im.src=it.thumb; im.alt=''; b.appendChild(im); } else { var ph=document.createElement('div'); ph.className='ph'; ph.textContent='3D'; b.appendChild(ph); }
    var sp=document.createElement('span'); sp.textContent=it.name; b.appendChild(sp);
    b.addEventListener('click',function(){ select(i); });
    row.appendChild(b); chips.push(b);
  });
  function say(t){ clearTimeout(capTimer); if(!t){ cap.parentNode.classList.add('hidden'); return; } cap.textContent=t; cap.parentNode.classList.remove('hidden'); capTimer=setTimeout(function(){ cap.parentNode.classList.add('hidden'); },6000); }

  /* ---------------- photo mode ---------------- */
  function showPhoto(){
    var it=ITEMS[idx];
    if(!it.img){ setMode('3d'); return; }
    var src = (showOrig && it.orig) ? it.orig : it.img;
    pfg.classList.add('swap');
    var tmp=new Image(); tmp.onload=function(){ pfg.src=src; pbg.src=src; pfg.classList.remove('swap'); }; tmp.src=src;
    $('toggleBA').classList.toggle('hidden', !it.orig);
    $('toggleBA').textContent = showOrig ? 'Show design' : 'Show original photo';
    say(it.caption||'');
  }
  $('toggleBA').addEventListener('click',function(){ showOrig=!showOrig; showPhoto(); });

  /* ---------------- selection / mode ---------------- */
  function mark(){ chips.forEach(function(c,i){ c.setAttribute('aria-pressed', i===idx?'true':'false'); }); try{ chips[idx].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}); }catch(e){} }
  function select(i){

    if(mode==='photo'){ showPhoto(); }

  }
  function setMode(m){
    if(m===mode) return; mode=m;

    $('badge').classList.toggle('hidden',m!=='3d'); $('to3d').classList.toggle('hidden',m!=='photo'||!ITEMS[idx].img);
    $('toggleBA').classList.toggle('hidden',m!=='photo'||!ITEMS[idx].orig);
    if(m==='3d'){ ensure3D(function(){ resize(); setView(camFor(ITEMS[idx])); }); } else { showPhoto(); }
    $('to3d').textContent='Look around in 3D';
  }
  $('mPhoto').addEventListener('click',function(){ setMode('photo'); });
  $('m3d').addEventListener('click',function(){ setMode('3d'); });
  $('to3d').addEventListener('click',function(){ setMode('3d'); });
  $('prev').addEventListener('click',function(){ select(idx-1); });
  $('next').addEventListener('click',function(){ select(idx+1); });
  document.addEventListener('keydown',function(e){ if(e.key==='ArrowLeft') select(idx-1); else if(e.key==='ArrowRight') select(idx+1); });
  (function(){ var x0=null,y0=null;
    photo.addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
    photo.addEventListener('touchend',function(e){ if(x0===null) return; var dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null; if(Math.abs(dx)>55&&Math.abs(dy)<60) select(idx+(dx<0?1:-1)); },{passive:true});
  })();

  /* ---------------- 3D (built on first use) ---------------- */
  var three=null, building=false, waiters=[];
  var renderer,scene,camera,controls,anim=null;
  function aspect(){ var w=stageEl.clientWidth||innerWidth,h=stageEl.clientHeight||innerHeight; return w/h; }
  function camFor(it){

  function ease(t){ return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2; }

    renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; stageEl.appendChild(renderer.domElement);
    scene=new THREE.Scene(); camera=new THREE.PerspectiveCamera(40,1,0.1,500);
    controls=new THREE.OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.dampingFactor=0.09; controls.screenSpacePanning=true; controls.minDistance=0.3; controls.maxDistance=120; controls.rotateSpeed=0.7;

      var cv=document.createElement('canvas'); cv.width=512; cv.height=256; var g=cv.getContext('2d'), gr=g.createLinearGradient(0,0,0,256);
      gr.addColorStop(0,'#27305a'); gr.addColorStop(.42,'#8d7fa8'); gr.addColorStop(.5,'#f0b990'); gr.addColorStop(.52,'#b79a82'); gr.addColorStop(1,'#6b5a4a'); g.fillStyle=gr; g.fillRect(0,0,512,256);
      var tex=new THREE.CanvasTexture(cv); tex.mapping=THREE.EquirectangularReflectionMapping; tex.encoding=THREE.sRGBEncoding;
      var pm=new THREE.PMREMGenerator(renderer); scene.environment=pm.fromEquirectangular(tex).texture; pm.dispose();
    }catch(e){}

    var sun=new THREE.DirectionalLight(0xffd3a0,2.1), sd=new THREE.Vector3(-0.97,0.30,0.14).normalize();
    sun.position.copy(sd).multiplyScalar(70).add(new THREE.Vector3(8,0,0)); sun.target.position.set(8,0,0); sun.castShadow=true;

    scene.add(sun); scene.add(sun.target); var fill=new THREE.DirectionalLight(0xb9c7ff,0.35); fill.position.set(30,25,-40); scene.add(fill);
    window.addEventListener('resize',resize); resize(); setView(camFor(ITEMS[idx].cam?ITEMS[idx]:ITEMS[ITEMS.length-1])); requestAnimationFrame(frame);
    getGLB(function(buf){
      meter.style.width='60%';
      new THREE.GLTFLoader().parse(buf,'',function(gltf){
        var an=Math.min(8,renderer.capabilities.getMaxAnisotropy());
        gltf.scene.traverse(function(o){ if(!o.isMesh) return; var m=o.material, nm=(m&&m.name)||'';
          o.castShadow=!(nm==='gravel'||nm==='glass'||nm==='waterfall'||nm==='water'||o.name==='Lawn'); o.receiveShadow=true;
          if(m){ if(m.metalness>0.3){ m.metalness=0.3; m.roughness=Math.max(m.roughness,0.35); } ['map','emissiveMap'].forEach(function(k){ if(m[k]) m[k].anisotropy=an; }); if(nm==='glass'||nm==='waterfall'||nm==='water'){ m.transparent=true; m.depthWrite=false; } m.envMapIntensity=0.7; } });
        scene.add(gltf.scene); three=true; meter.style.width='100%'; load.classList.add('done'); waiters.splice(0).forEach(function(f){ f(); });
      },function(){ loadTxt.textContent='The 3D model could not be read. Reload the page.'; });
    },function(){ loadTxt.textContent='The 3D model could not load. Reload the page.'; });
  }
  function getGLB(ok,fail){
    var el=document.getElementById('glbdata');
    if(el){ try{ var bin=atob(el.textContent.trim()), n=bin.length, b=new Uint8Array(n); for(var i=0;i<n;i++) b[i]=bin.charCodeAt(i); ok(b.buffer); }catch(e){ fail(); } return; }
    fetch(GLB_URL).then(function(r){ return r.arrayBuffer(); }).then(ok).catch(fail);
  }

  /* ---------------- start in photo mode ---------------- */
  var first=ITEMS.findIndex(function(i){ return i.img; }); idx=Math.max(0,first); mark();
  var im0=new Image(); im0.onload=function(){ pfg.src=im0.src; pbg.src=im0.src; load.classList.add('done'); showPhoto(); $('to3d').classList.remove('hidden'); }; im0.onerror=function(){ loadTxt.textContent='Could not load the photos.'; }; im0.src=ITEMS[idx].img;
  meter.style.width='40%';
})();
</script>
